<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Bitstream Charter, Charter, Georgia, Times New Roman, serif">
<rect width="1600" height="900" fill="#FAF7F0"/>
<text x="207.0" y="89.0" font-size="27.0" font-weight="700" fill="#0B0C0E" letter-spacing="1.6">WHICH DOOR?</text>
<text x="207.0" y="123.0" font-size="22.0" fill="#5D5E63">Spouses of citizens</text>
<text x="88" y="206" font-size="22" font-weight="700" fill="#5D5E63" letter-spacing="1.4">SPOUSES OF CITIZENS: TIME TO CITIZENSHIP</text>
<text x="404" y="295" font-size="24" font-weight="700" fill="#0B0C0E" text-anchor="end">Ireland</text>
<rect x="420" y="273" width="168" height="26" rx="2" fill="#148708"/>
<text x="608" y="295" font-size="24" font-weight="700" fill="#148708">3y</text>
<text x="1160" y="294" font-size="18" fill="#5D5E63">Fastest door - genuine marriage required</text>
<text x="404" y="357" font-size="24" font-weight="700" fill="#0B0C0E" text-anchor="end">France</text>
<rect x="420" y="335" width="280" height="26" rx="2" fill="#5D5E63"/>
<text x="720" y="357" font-size="24" font-weight="700" fill="#5D5E63">5y</text>
<text x="1160" y="356" font-size="18" fill="#5D5E63">Spouses of French citizens can acquire by declaration after 4 years marriage</text>
<text x="404" y="419" font-size="24" font-weight="700" fill="#0B0C0E" text-anchor="end">Germany</text>
<rect x="420" y="397" width="168" height="26" rx="2" fill="#5D5E63"/>
<text x="608" y="419" font-size="24" font-weight="700" fill="#5D5E63">3y</text>
<text x="404" y="481" font-size="24" font-weight="700" fill="#0B0C0E" text-anchor="end">UK</text>
<rect x="420" y="459" width="168" height="26" rx="2" fill="#5D5E63"/>
<text x="608" y="481" font-size="24" font-weight="700" fill="#5D5E63">3y</text>
<text x="1160" y="480" font-size="18" fill="#5D5E63">5 years residence + 3 years marriage minimum</text>
<text x="404" y="543" font-size="24" font-weight="700" fill="#0B0C0E" text-anchor="end">Austria</text>
<rect x="420" y="521" width="560" height="26" rx="2" fill="#5D5E63"/>
<text x="1000" y="543" font-size="24" font-weight="700" fill="#5D5E63">10y</text>
<text x="1160" y="542" font-size="18" fill="#5D5E63">Non-EU spouse standard (10y); EU/EEA spouse (3y)</text>
</svg>
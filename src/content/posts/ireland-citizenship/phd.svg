<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" font-family="Bitstream Charter, Charter, Georgia, Times New Roman, serif">
<rect width="1600" height="900" fill="#FAF7F0"/>
<text x="207.0" y="89.0" font-size="27.0" font-weight="700" fill="#0B0C0E" letter-spacing="1.6">WHICH DOOR?</text>
<text x="207.0" y="123.0" font-size="22.0" fill="#5D5E63">PhD students</text>
<text x="88" y="206" font-size="22" font-weight="700" fill="#5D5E63" letter-spacing="1.4">PhD STUDENTS: TIME TO CITIZENSHIP</text>
<text x="404" y="295" font-size="24" font-weight="700" fill="#0B0C0E" text-anchor="end">Ireland</text>
<rect x="420" y="273" width="224" height="26" rx="2" fill="#D8D2C6"/>
<rect x="644" y="273" width="280" height="26" rx="2" fill="#148708"/>
<text x="944" y="295" font-size="24" font-weight="700" fill="#148708">9y</text>
<text x="1280" y="294" font-size="18" fill="#5D5E63">4 years on Stamp 2 discarded; all 4y are non-counted time</text>
<text x="1280" y="312" font-size="14" fill="#8B8C8F">Processing: 12–19 months</text>
<text x="404" y="357" font-size="24" font-weight="700" fill="#0B0C0E" text-anchor="end">France</text>
<rect x="420" y="335" width="224" height="26" rx="2" fill="#D8D2C6"/>
<rect x="644" y="335" width="280" height="26" rx="2" fill="#5D5E63"/>
<text x="944" y="357" font-size="24" font-weight="700" fill="#5D5E63">9y</text>
<text x="1280" y="356" font-size="18" fill="#5D5E63">All 4 doctoral years count</text>
<text x="1280" y="374" font-size="14" fill="#8B8C8F">Processing: 18–24 months</text>
<text x="404" y="419" font-size="24" font-weight="700" fill="#0B0C0E" text-anchor="end">Germany</text>
<rect x="420" y="397" width="224" height="26" rx="2" fill="#D8D2C6"/>
<rect x="644" y="397" width="280" height="26" rx="2" fill="#5D5E63"/>
<text x="944" y="419" font-size="24" font-weight="700" fill="#5D5E63">9y</text>
<text x="1280" y="418" font-size="18" fill="#5D5E63">All 4 years count via settlement permit</text>
<text x="1280" y="436" font-size="14" fill="#8B8C8F">Processing: 4–8 months</text>
<text x="404" y="481" font-size="24" font-weight="700" fill="#0B0C0E" text-anchor="end">UK</text>
<rect x="420" y="459" width="224" height="26" rx="2" fill="#D8D2C6"/>
<rect x="644" y="459" width="280" height="26" rx="2" fill="#5D5E63"/>
<text x="944" y="481" font-size="24" font-weight="700" fill="#5D5E63">9y</text>
<text x="1280" y="480" font-size="18" fill="#5D5E63">4-year PhD: first 2 years on student visa (discarded); last 2 years count toward 5-year requirement</text>
<text x="1280" y="498" font-size="14" fill="#8B8C8F">Processing: 6–12 months</text>
<text x="404" y="543" font-size="24" font-weight="700" fill="#0B0C0E" text-anchor="end">Austria</text>
<rect x="420" y="521" width="224" height="26" rx="2" fill="#D8D2C6"/>
<rect x="644" y="521" width="560" height="26" rx="2" fill="#5D5E63"/>
<text x="1224" y="543" font-size="24" font-weight="700" fill="#5D5E63">14y</text>
<text x="1280" y="542" font-size="18" fill="#5D5E63">4 years on student visa discarded; no special provision</text>
<text x="1280" y="560" font-size="14" fill="#8B8C8F">Processing: 6–12 months</text>
</svg>